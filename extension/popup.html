<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* ── Tokens ─────────────────────────────────────────────
       한 기기를 다른 조명 아래서 보는 느낌. 두 테마가 같은 정체성을 공유한다. */
    :root {
      --bg:        #0b0b0d;
      --surface:   #141417;
      --surface-2: #1b1b1f;
      --line:      #232329;
      --line-soft: #17171b;
      --ink:       #f4f4f5;
      --ink-2:     #a1a1aa;
      --ink-3:     #6b6b74;
      --accent:    #6366f1;
      --accent-in: #ffffff;
      --signal:    #34d399;
      --caution:   #fbbf24;
      --alert:     #f87171;
      --link:      #818cf8;
      --caution-bg: rgba(251,191,36,.10);
      --caution-br: rgba(251,191,36,.28);
      --signal-bg:  rgba(52,211,153,.12);
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg:        #fbfbfc;
      --surface:   #ffffff;
      --surface-2: #f4f4f6;
      --line:      #e5e5ea;
      --line-soft: #efeff2;
      --ink:       #18181b;
      --ink-2:     #52525b;
      --ink-3:     #8b8b93;
      --accent:    #4f46e5;
      --accent-in: #ffffff;
      --signal:    #059669;
      --caution:   #b45309;
      --alert:     #dc2626;
      --link:      #4f46e5;
      --caution-bg: rgba(180,83,9,.07);
      --caution-br: rgba(180,83,9,.22);
      --signal-bg:  rgba(5,150,105,.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0c0c0c;
      color: #e0e0e0;
      font-size: 13px;
      overflow-y: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #1a1a1a;
      position: sticky;
      top: 0;
      background: #0c0c0c;
      z-index: 10;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #3b82f6; }
    .btn-ghost {
      background: transparent;
      color: #888;
      padding: 6px 8px;
    }
    .btn-ghost:hover { color: #fff; background: #1a1a1a; }
    .btn-danger {
      background: transparent;
      color: #666;
      padding: 4px 6px;
      font-size: 11px;
    }
    .btn-danger:hover { color: #ef4444; }

    /* Setup screen */
    .setup {
      padding: 32px 20px;
      text-align: center;
    }
    .setup p {
      color: #888;
      margin: 8px 0 20px;
      line-height: 1.5;
    }
    .setup input {
      width: 100%;
      padding: 10px 12px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    .setup input:focus { border-color: #2563eb; }
    .setup .btn { width: 100%; padding: 10px; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid #1a1a1a;
      margin-top: 16px;
    }
    .toggle-row label {
      font-size: 13px;
      color: #ccc;
    }
    .toggle-row .sub {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle input { display: none; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: #2563eb; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .detail-recipient {
      padding: 0 16px 8px;
      font-size: 12px;
      color: #60a5fa;
    }

    /* Pixel list */
    .pixel-list {
      padding: 4px 0;
    }
    .pixel-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #141414;
      cursor: pointer;
      transition: background 0.1s;
    }
    .pixel-item:hover { background: #141414; }
    .pixel-info { flex: 1; min-width: 0; }
    .pixel-id {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: #fff;
      font-weight: 500;
    }
    .pixel-meta {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }
    .pixel-recipient {
      font-size: 12px;
      color: #60a5fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pixel-opens {
      font-size: 18px;
      font-weight: 700;
      color: #34d399;
      margin-right: 12px;
      min-width: 28px;
      text-align: right;
    }
    .pixel-actions {
      display: flex;
      gap: 2px;
      margin-left: 8px;
    }

    /* Detail view */
    .detail {
      display: none;
    }
    .detail.active { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #1a1a1a;
      gap: 10px;
      position: sticky;
      top: 0;
      background: #0c0c0c;
      z-index: 10;
    }
    .detail-header h2 {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      font-family: monospace;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }
    .stat-card .value.orange { color: #fb923c; }
    .stat-card .value.blue { color: #60a5fa; }
    .stat-card {
      background: #141414;
      border-radius: 8px;
      padding: 12px;
    }
    .stat-card label {
      font-size: 10px;
      text-transform: uppercase;
      color: #555;
      letter-spacing: 0.5px;
    }
    .stat-card .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }
    .stat-card .value.green { color: #34d399; }

    /* Snippet box */
    .snippet-section {
      padding: 8px 16px 12px;
    }
    .snippet-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .snippet-box {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      color: #a0a0a0;
      word-break: break-all;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s;
    }
    .snippet-box:hover { border-color: #2563eb; }
    /* Event tabs */
    .event-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 10px;
      border-bottom: 1px solid #1a1a1a;
    }
    .event-tab {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .event-tab:hover { color: #aaa; }
    .event-tab.active {
      color: #fff;
      border-bottom-color: #2563eb;
    }

    /* Events list */
    .events-section {
      padding: 0 16px 16px;
    }
    .events-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: #555;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .event-item {
      background: #141414;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .event-item .event-time {
      color: #60a5fa;
      font-weight: 500;
    }
    .event-item .event-detail {
      color: #555;
      margin-top: 2px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #444;
    }
    .empty p { margin-top: 8px; font-size: 12px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #2563eb;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      transition: transform 0.2s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #444;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #222;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto 10px;
    }

    /* ── Theme mapping ──────────────────────────────────────
       위 규칙들의 하드코딩 색을 토큰으로 덮는다. 같은 특이도, 뒤에 오므로 이긴다. */
    body { background: var(--bg); color: var(--ink); }
    .header { background: var(--bg); border-bottom-color: var(--line); }
    .header h1 { color: var(--ink); letter-spacing: -0.01em; }

    .btn-primary { background: var(--accent); color: var(--accent-in); }
    .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
    .btn-ghost { color: var(--ink-2); }
    .btn-ghost:hover { color: var(--ink); background: var(--surface-2); }

    /* 아이콘 버튼 — 텍스트 글리프(⚙) 대신 SVG, 손가락이 닿는 크기로 */
    .icon-btn {
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; border: none; border-radius: 9px;
      background: transparent; color: var(--ink-2);
      cursor: pointer; transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-btn svg { width: 19px; height: 19px; display: block; }
    .header-actions { gap: 4px; align-items: center; }

    .setup p { color: var(--ink-2); }
    .setup input {
      background: var(--surface); border-color: var(--line); color: var(--ink);
      font-family: var(--mono); font-size: 12px;
    }
    .setup input::placeholder { color: var(--ink-3); }
    .setup input:focus { border-color: var(--accent); }

    .pixel-item { border-bottom-color: var(--line-soft); }
    .pixel-item:hover { background: var(--surface); }

    /* 글리프 거터 — 숫자 대신 상태 하나. 목록이 로그처럼 읽힌다. */
    .pixel-opens {
      min-width: 22px; text-align: center;
      font-family: var(--mono); line-height: 1;
    }
    /* 주소는 사람 이름이 아니라 기계 식별자다. 모노로 둔다. */
    .pixel-recipient { color: var(--ink); font-family: var(--mono); font-size: 12px; }
    .pixel-id { color: var(--ink-3); font-family: var(--mono); }
    .pixel-meta {
      color: var(--ink-3); font-family: var(--mono); font-size: 10.5px;
      letter-spacing: .01em;
    }

    .detail-recipient { color: var(--link); font-family: var(--mono); font-size: 12px; }
    .stat-card { background: var(--surface); border: 1px solid var(--line); }
    .stat-card label {
      color: var(--ink-3); font-size: 9.5px; font-weight: 600;
      letter-spacing: .09em; text-transform: uppercase;
    }
    .stat-card .value { color: var(--ink); }
    .stat-card .value.green { color: var(--signal); }
    .stat-card .value.orange { color: var(--caution); }
    .stat-card .value.blue { color: var(--link); }

    .snippet, .event-item { background: var(--surface); border-color: var(--line); }
    .snippet { font-family: var(--mono); color: var(--ink-2); }
    .event-time { color: var(--link); font-family: var(--mono); font-size: 11px; }
    .event-detail { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
    .event-tab { color: var(--ink-3); }
    .event-tab.active { color: var(--ink); border-bottom-color: var(--accent); }

    .toast { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
    .empty { color: var(--ink-3); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    /* 목록 행 — 제목이 주인공, 나머지는 로그 */
    .pixel-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 11px 16px; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .13s ease, border-color .13s ease;
    }
    .pixel-item:hover { background: var(--surface); border-left-color: var(--accent); }
    .pixel-item:hover .pixel-subject { color: var(--link); }
    .pixel-item:active { background: var(--surface-2); }
    .pixel-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .pixel-subject {
      color: var(--ink); font-size: 12.5px; font-weight: 550;
      line-height: 1.35; transition: color .13s ease;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pixel-subject.untitled { color: var(--ink-3); font-style: italic; font-weight: 400; }
    .pixel-info { min-width: 0; flex: 1; }

    /* ── Theme mapping (2차) ────────────────────────────────
       누락분 + 특이도 역전 교정.
       `.event-item .event-time`(0,2,0) 처럼 원본이 더 강한 선택자를 쓰는 곳은
       같은 형태로 다시 써야 이긴다. */
    .detail-header { background: var(--bg); border-bottom-color: var(--line); }
    .detail-header h1 { color: var(--ink); }

    .btn-danger { color: var(--ink-3); }
    .btn-danger:hover { color: var(--alert); }

    .toggle-row { border-top-color: var(--line); }
    .toggle-row label { color: var(--ink-2); }
    .toggle-row .sub { color: var(--ink-3); }
    .toggle .slider { background: var(--line); }
    .toggle .slider::before { background: #fff; }
    .toggle input:checked + .slider { background: var(--accent); }

    .snippet-label { color: var(--ink-3); }
    .snippet-box {
      background: var(--surface); border-color: var(--line);
      color: var(--ink-2); font-family: var(--mono);
    }
    .snippet-box:hover { border-color: var(--accent); }

    .event-tabs { border-bottom-color: var(--line); }
    .event-tab:hover { color: var(--ink-2); }
    .events-section h3 { color: var(--ink-3); }

    .event-item { background: var(--surface); border-color: var(--line); }
    .event-item .event-time { color: var(--link); }
    .event-item .event-detail { color: var(--ink-3); }

    .pixel-id { color: var(--ink); }
    .pixel-opens { color: var(--signal); }

    .empty, .loading { color: var(--ink-3); }
    .spinner { border-color: var(--line); border-top-color: var(--accent); }

    .toast { background: var(--ink); color: var(--bg); border: none; }

    /* 라이트에서 흰 위 흰 글씨 방지 — 원본이 #fff 로 박아둔 곳들 */
    :root[data-theme="light"] .header h1,
    :root[data-theme="light"] .stat-card .value,
    :root[data-theme="light"] .event-tab.active { color: var(--ink); }
    :root[data-theme="light"] .btn-primary { color: #fff; }
  </style>
</head>
<body>
  <!-- Main List View -->
  <div id="list-view">
    <div class="header">
      <h1><svg width="20" height="20" viewBox="0 0 100 100" style="flex-shrink:0"><rect width="100" height="100" rx="20" fill="#6366f1"/><path d="M20 35c0-3 2-5 5-5h50c3 0 5 2 5 5v30c0 3-2 5-5 5H25c-3 0-5-2-5-5V35z" fill="none" stroke="white" stroke-width="5"/><path d="M22 33l28 22 28-22" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="28" r="12" fill="#34d399"/></svg> Mail Tracker</h1>
      <div class="header-actions">
        <button class="icon-btn" id="theme-btn" title="Switch to light theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g id="icon-moon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></g>
            <g id="icon-sun" style="display:none"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></g>
          </svg>
        </button>
        <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1"/>
            <path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06A1.7 1.7 0 0015 19.4a1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.33-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09A1.7 1.7 0 0015 4.6a1.7 1.7 0 001.87-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9v0a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1z"/>
          </svg>
        </button>
        <button class="btn btn-primary" id="new-btn">+ Manual</button>
      </div>
    </div>
    <div id="pixel-container">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>

  <!-- Detail View -->
  <div id="detail-view" class="detail">
    <div class="detail-header">
      <button class="btn btn-ghost" id="back-btn">&#8592;</button>
      <h2 id="detail-id"></h2>
      <button class="btn btn-danger" id="delete-btn" title="Delete tracker">&#128465;</button>
    </div>
    <div class="detail-recipient" id="detail-recipient"></div>
    <div id="detail-caveat" style="display:none;margin:10px 0 4px;padding:9px 11px;border-radius:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:#fbbf24;font-size:11px;line-height:1.5;"></div>
    <div class="stat-cards">
      <div class="stat-card">
        <label>Status</label>
        <div class="value green" id="detail-opens" style="font-size:15px;">—</div>
      </div>
      <div class="stat-card">
        <label>Last Activity</label>
        <div class="value" id="detail-last" style="font-size:13px;">—</div>
      </div>
      <div class="stat-card">
        <label>Filtered Out</label>
        <div class="value orange" id="detail-skipped">0</div>
      </div>
      <div class="stat-card">
        <label>Sender Protection</label>
        <div class="value blue" id="detail-protection" style="font-size:13px;">—</div>
      </div>
    </div>
    <div class="snippet-section">
      <div class="snippet-label">HTML Snippet (click to copy)</div>
      <div class="snippet-box" id="snippet-html"></div>
    </div>
    <div class="snippet-section">
      <div class="snippet-label">Tracking URL (click to copy)</div>
      <div class="snippet-box" id="snippet-url"></div>
    </div>
    <div class="events-section">
      <div class="event-tabs">
        <button class="event-tab active" data-tab="recent">Recent</button>
        <button class="event-tab" data-tab="filtered">Filtered</button>
      </div>
      <div id="events-list"></div>
      <div id="filtered-list" style="display:none;"></div>
    </div>
  </div>

  <!-- Setup View -->
  <div id="setup-view" style="display:none;">
    <div class="header" id="setup-header" style="display:none;">
      <h1>&#9881; Settings</h1>
      <button class="btn btn-ghost" id="setup-back-btn">&#8592;</button>
    </div>
    <div class="setup">
      <p>Enter your Mail Tracker server URL (your Cloudflare Worker URL)</p>
      <input type="url" id="server-input" placeholder="https://track.edword.ai" />
      <div style="position:relative;">
        <input type="password" id="password-input" placeholder="Your access token" style="padding-right:36px;" />
        <button type="button" id="toggle-password" style="position:absolute;right:8px;top:40%;transform:translateY(-50%);background:none;border:none;color:#555;cursor:pointer;padding:4px;line-height:0;" title="Show token"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button class="btn btn-primary" id="save-btn">Save & Connect</button>
      <p id="setup-error" style="color:#ef4444;margin-top:12px;display:none;"></p>

      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">
        <label for="autotrack-input" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
          <input type="checkbox" id="autotrack-input" style="margin-top:2px;flex:0 0 auto;width:16px;height:16px;accent-color:#6366f1;cursor:pointer;" />
          <span style="flex:1;">
            <span style="display:block;color:#fafafa;font-size:13px;font-weight:600;">Track new emails automatically</span>
            <span style="display:block;color:#71717a;font-size:11px;margin-top:3px;line-height:1.45;">
              Sets the default for every compose window. Turn it off to track only
              the emails you choose. You can always flip it per email with the
              Tracking button next to Send.
            </span>
          </span>
        </label>

        <label for="notify-input" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-top:14px;">
          <input type="checkbox" id="notify-input" style="margin-top:2px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--accent);cursor:pointer;" />
          <span style="flex:1;">
            <span style="display:block;color:var(--ink);font-size:13px;font-weight:600;">Show a Chrome notification on new activity</span>
            <span style="display:block;color:var(--ink-3);font-size:11px;margin-top:3px;line-height:1.45;">
              Off by default. When on, the extension checks for new activity every
              five minutes and notifies you.
            </span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
